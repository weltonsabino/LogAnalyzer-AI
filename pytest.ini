[pytest]
# Configuração do pytest para LogAnalyzer AI

# Diretórios de teste
testpaths = tests

# Padrão de nome de arquivo de teste
python_files = test_*.py

# Padrão de classe de teste
python_classes = Test*

# Padrão de função de teste
python_functions = test_*

# Opções padrão
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Marcadores customizados
markers =
    unit: Testes unitários de ferramentas e funções
    integration: Testes de integração entre componentes
    e2e: Testes end-to-end do fluxo completo
    slow: Testes que levam mais tempo para executar
    requires_api: Testes que requerem API key OpenAI
